name: ZAP baseline

# Report-only ZAP baseline scan of a caller-supplied URL.
# Set fail-on-high to fail the job when the report contains a High alert.
# The upstream action's fail_action flag treats every alert as a failure,
# so it stays off and this workflow applies the high-only gate itself.
# No issue is opened and no secret is required.

on:
  workflow_call:
    inputs:
      target-url:
        description: "Absolute http or https URL to scan. Pass it from the caller at runtime."
        required: true
        type: string
      fail-on-high:
        description: "Fail the job when the report contains at least one High alert."
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Artifact name for the ZAP HTML, Markdown, and JSON reports."
        required: false
        type: string
        default: "zap-baseline"

permissions:
  contents: read

concurrency:
  group: zap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: zap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          TARGET_URL: ${{ inputs.target-url }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlparse

          target = os.environ["TARGET_URL"]
          parsed = urlparse(target)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              sys.exit("target-url must be an absolute http or https URL")
          if any(character in target for character in " \t\n\r\"'`$;&|<>"):
              sys.exit("target-url contains characters the ZAP action would pass to a shell")
          name = os.environ["ARTIFACT_NAME"]
          if re.fullmatch(r"[A-Za-z0-9._-]{1,64}", name) is None:
              sys.exit("artifact-name must be a short filename")
          PY

      - name: Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ github.token }}
          target: ${{ inputs.target-url }}
          # 2.17.0, which was the stable tag on 2026-10-26.
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          fail_action: false
          allow_issue_writing: false
          artifact_name: ${{ inputs.artifact-name }}

      - name: Apply high-alert gate
        if: ${{ !cancelled() }}
        env:
          FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          path = "report_json.json"
          if not os.path.isfile(path):
              sys.exit("ZAP did not write report_json.json")
          with open(path, encoding="utf-8") as handle:
              document = json.load(handle)

          sites = document.get("site") or []
          if isinstance(sites, dict):
              sites = [sites]

          high = []
          other = 0
          for site in sites:
              for alert in site.get("alerts") or []:
                  code = str(alert.get("riskcode", ""))
                  description = str(alert.get("riskdesc", ""))
                  name = alert.get("alert") or alert.get("name") or "alert"
                  count = alert.get("count", "")
                  if code == "3" or description.lower().startswith("high"):
                      high.append(f"{name} ({description}, instances {count})")
                  else:
                      other += 1

          print(f"High alerts: {len(high)}; other alerts: {other}")
          fail = os.environ["FAIL_ON_HIGH"].strip().lower() == "true"
          for item in high:
              if fail:
                  print(f"::error::{item}")
              else:
                  print(f"::warning::{item}")
          if fail and high:
              sys.exit(1)
          if not fail:
              print("Report only. Set fail-on-high to fail this job.")
          PY
