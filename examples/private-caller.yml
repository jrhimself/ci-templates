# Security caller for a private repository. Copy to .github/workflows/security.yml.
# visibility: private skips CodeQL and Scorecard.
# Every pull request and every Monday. A merge to main does not run it again: the pull
# request already scanned that code, and the schedule scans the whole git history.
# The checks of the application itself are in ci.yml; see "Recommended pipeline" in the README.
name: Security

on:
  pull_request:
  # Monday 03:15 UTC, before Dependabot at 06:00 Europe/Amsterdam.
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

# GitHub checks every job's permissions at startup, also the public-only jobs this
# caller skips. The ceiling is the union of those declarations.
permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: jrhimself/platform/.github/workflows/security.yml@v1
    with:
      visibility: private
      node-version: "22"
      working-directory: .
