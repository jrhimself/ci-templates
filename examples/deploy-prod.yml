# Releases v + the version in package.json to production. Copy to .github/workflows/deploy-prod.yml.
# Two ways in: push the tag v*, or start this workflow by hand on main. By hand it stops when that
# tag already exists, and the GitHub release creates the tag only after the deploy and the smoke
# check, so a version that does not answer is never recorded as released. A tag made with
# GITHUB_TOKEN starts no new workflow run, so the tag trigger does not deploy a second time.
# Starting by hand suits a person or an agent that may start workflows but cannot push tags.
# PROD_URL is a repository variable. The deploy step is the application's own; this one uses Wrangler.
# The release notes here are generated by GitHub. A repository with a CHANGELOG.md can instead check
# for a section per version before the deploy and pass it with --notes-file.
name: Deploy prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Start Deploy prod by hand from main only (now $GITHUB_REF_NAME)."
              exit 1
            fi
            exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
            if [ -n "$exists" ]; then
              echo "::error::Tag $tag already exists. Raise the version in package.json first."
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The pull request checked this code; check it once more before production.
      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Smoke check
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: scripts/smoke.sh "$PROD_URL"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        # --target creates the tag on the deployed commit when it does not exist yet.
        run: gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
