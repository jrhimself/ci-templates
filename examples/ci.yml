# Checks of an application, on every pull request, once. Copy to .github/workflows/ci.yml.
# A merge to main does not run them again: the pull request already checked that code.
# check runs the application's own lint, typecheck, tests and build. e2e starts only when
# check is green. A pull request that changes only Markdown or docs/ makes check green
# within seconds and skips e2e. That is decided in the job, not with paths-ignore, so a
# required check never waits for a run that does not start.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base), to list what changed.
          fetch-depth: 2

      - name: Only docs?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=false
          if [ "$EVENT" != "pull_request" ]; then
            code=true
          else
            while IFS= read -r file; do
              case "$file" in
                ''|*.md|docs/*) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then echo "Code changed: full check."; else echo "Only docs: check skipped."; fi

      - name: Node 22
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Replace with the application's own commands.
      - name: Install
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Tests
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

  # Use working-directory e2e when that directory has its own package.json.
  # When dependencies live at the repository root, keep working-directory as
  # "." and set command to npx playwright test --config e2e/playwright.config.ts.
  e2e:
    needs: check
    if: needs.check.outputs.code == 'true'
    uses: jrhimself/platform/.github/workflows/e2e.yml@v1
    with:
      node-version: "22"
      working-directory: .
